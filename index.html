<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音计时器</title>
    <style>
        body {

            background-color: black;

        }

        button {

            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 70vw;
            height: 100px;
            font: 700 39px "微软雅黑";
            border-radius: 100px;
            border: 10px solid white;

        }

        #start {

            top: 30%;

        }

        #end {

            top: 60%;

        }

        #version {

            position: fixed;
            bottom: 0;
            padding-bottom: 20px;
            transform: translate(-50%, 0);
            left: 50%;
            color: white;
            font: 700 30px "微软雅黑";

        }
    </style>
</head>

<body>

    <button id="start">开始计时</button>
    <button id="end">结束计时</button>
    <span id="version">&copy; 1.0.8</span>

    <script type="module">

        // 兼容小米系统语速
        const XiaoMi = await navigator.userAgentData.getHighEntropyValues(["model", "platform", "platformVersion"])
            .then(ua => {

                if (ua.model === 'M2012K11AC') {

                    alert('小米系统');

                    return true;

                } else {

                    return false;

                }

            });

        const start = document.querySelector('#start');
        const end = document.querySelector('#end');
        let clearTimer = null;
        let i = 0;

        // 预创建语速对象，避免在定时器里重复创建对象，提高性能
        const synth = window.speechSynthesis;

        // 每秒都 new 一个新的语音实例，会损耗性能，只创建一个实例，每秒只修改它的 text 属性
        const msg = new SpeechSynthesisUtterance();

        start.addEventListener('click', (e) => {

            if (clearTimer) clearInterval(clearTimer);

            i = 0; // 重置计数

            // 立即停止之前的播报
            synth.cancel();

            clearTimer = setInterval(() => {

                i++;

                // 格式化：前 60 秒只报数字，提高效率
                //     如果是刚好1分钟整，会报 " 1分零 "
                //     因此如果 i % 60 === 0 说明到了分钟整，返回空字符串，而不是还要读一下零
                let timeStr = i < 60 ? `${i}` : `${Math.floor(i / 60)}分${i % 60 === 0 ? '' : i % 60}`;

                msg.text = timeStr;

                if (XiaoMi) {

                    msg.rate = 0.5; // 建议 2-3 之间，兼顾速度与清晰度

                } else {

                    msg.rate = 1; // 建议 2-3 之间，兼顾速度与清晰度

                };

                msg.lang = 'zh-CN';

                // 关键：先取消旧的，再播报新的，防止队列堆积
                synth.cancel();
                synth.speak(msg);

            }, 1000);
        });

        end.addEventListener('click', () => {
            clearInterval(clearTimer);
            synth.cancel(); // 停止播报
        });

    </script>

</body>

</html>
